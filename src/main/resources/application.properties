spring.application.name=financas-api
spring.profiles.default=dev

# Autenticação via JWT: evita a senha aleatória padrão do Spring Security
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# --- Banco de dados (Neon em produção) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/financas}
spring.datasource.username=${DB_USER:financas}
spring.datasource.password=${DB_PASSWORD:financas}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
# tolera o cold start do Neon
spring.datasource.hikari.connection-timeout=30000

# --- JPA ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway (no Neon, rode migrations pela conexão direta, sem pooler) ---
spring.flyway.enabled=true
spring.flyway.url=${FLYWAY_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/financas}}
spring.flyway.user=${DB_USER:financas}
spring.flyway.password=${DB_PASSWORD:financas}

spring.jackson.default-property-inclusion=non_null

# --- Servidor ---
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never

# --- Actuator (health público para o UptimeRobot) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Segurança da aplicação ---
app.security.jwt-secret=${JWT_SECRET}
app.security.access-token-ttl=15m
app.security.refresh-token-ttl=14d
app.security.cookie-secure=${COOKIE_SECURE:false}
app.security.cookie-same-site=${COOKIE_SAMESITE:Lax}
app.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173}
app.security.bcrypt-strength=${BCRYPT_STRENGTH:10}
