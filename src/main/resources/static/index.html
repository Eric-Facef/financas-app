<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Finanças</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0b132b">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4"></script>
  <style>
    body{background:#0b132b;color:#f1f5f9;font-family:system-ui,-apple-system,sans-serif}
    .card{background:rgba(28,37,65,.7);border:1px solid rgba(255,255,255,.08);border-radius:1rem;padding:1rem}
    .in{width:100%;background:#0f172a;border:1px solid #334155;border-radius:.5rem;padding:.55rem .75rem;font-size:.875rem}
    .in:focus{outline:none;border-color:#22d3ee}
    .btn{width:100%;border-radius:.5rem;padding:.65rem;font-weight:600;font-size:.875rem;background:#0891b2}
    .btn:hover{background:#06b6d4}
    .lbl{display:block;font-size:.75rem;color:#94a3b8;margin-bottom:.25rem}
    .tab{padding-bottom:.5rem;border-bottom:2px solid transparent;color:#94a3b8}
    .tab.on{border-color:#22d3ee;color:#22d3ee;font-weight:600}
  </style>
</head>
<body class="min-h-screen">

  <!-- LOGIN / CADASTRO -->
  <div id="authView" class="hidden fixed inset-0 flex items-center justify-center p-4">
    <form id="authForm" class="card w-full max-w-sm space-y-4">
      <h1 class="text-xl font-bold text-center" id="authTitle">Entrar</h1>
      <div><label class="lbl">E-mail</label><input id="email" type="email" required autocomplete="username" class="in"></div>
      <div><label class="lbl">Senha (mín. 8 caracteres)</label><input id="password" type="password" required minlength="8" autocomplete="current-password" class="in"></div>
      <p id="authError" class="text-sm text-red-400 hidden"></p>
      <button class="btn" id="authSubmit">Entrar</button>
      <button type="button" id="authToggle" class="w-full text-xs text-cyan-400">Não tem conta? Cadastre-se</button>
    </form>
  </div>

  <!-- APP -->
  <div id="appView" class="hidden max-w-5xl mx-auto p-4 pb-16 space-y-5">
    <header class="flex items-center justify-between gap-2">
      <div><h1 class="font-bold">Controle Financeiro</h1><p id="userEmail" class="text-xs text-slate-400"></p></div>
      <div class="flex items-center gap-2">
        <input id="month" type="month" class="in !w-auto">
        <button id="installBtn" class="hidden text-xs text-cyan-400 border border-cyan-500/40 rounded-lg px-3 py-2">Instalar</button>
        <button id="logoutBtn" class="text-xs text-slate-400 hover:text-red-400 px-2">Sair</button>
      </div>
    </header>

    <nav class="flex gap-4 text-sm border-b border-slate-800">
      <button class="tab on" data-tab="dash">Dashboard</button>
      <button class="tab" data-tab="sobra">Sobra do mês</button>
      <button class="tab" data-tab="audit">Auditoria</button>
    </nav>

    <section id="t-dash" class="space-y-5">
      <div id="accounts" class="grid grid-cols-1 sm:grid-cols-3 gap-3"></div>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <form id="txForm" class="card space-y-3">
          <h2 class="font-semibold">Novo lançamento</h2>
          <div><label class="lbl">Descrição</label><input id="txDesc" required maxlength="160" class="in" placeholder="Ex.: Supermercado"></div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="lbl">Valor (R$)</label><input id="txAmount" type="number" step="0.01" min="0.01" required class="in"></div>
            <div><label class="lbl">Tipo</label>
              <select id="txType" class="in"><option value="EXPENSE">Despesa</option><option value="INCOME">Receita</option></select></div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="lbl">Categoria</label><select id="txCat" class="in"></select></div>
            <div><label class="lbl">Conta</label><select id="txAcc" class="in"></select></div>
          </div>
          <button class="btn">Salvar lançamento</button>
        </form>
        <div class="card">
          <div class="flex justify-between mb-2"><h2 class="font-semibold">Despesas por categoria (%)</h2><span id="expTotal" class="text-xs text-slate-400"></span></div>
          <div class="relative h-60"><canvas id="chart"></canvas></div>
          <p id="chartEmpty" class="hidden text-center text-sm text-slate-500 pt-20">Sem despesas neste mês.</p>
        </div>
      </div>
      <div class="card">
        <h2 class="font-semibold mb-3">Lançamentos do mês</h2>
        <div id="txList" class="space-y-2 max-h-96 overflow-y-auto"></div>
      </div>
    </section>

    <section id="t-sobra" class="hidden">
      <form id="trForm" class="card space-y-4 max-w-lg">
        <h2 class="font-semibold">Alocar sobra na poupança</h2>
        <div class="flex justify-between items-center bg-slate-900/60 rounded-xl p-3">
          <div><p class="text-xs text-slate-400">Sobra disponível no mês</p><p id="leftover" class="text-2xl font-bold text-purple-400"></p></div>
          <button type="button" id="allocAll" class="text-xs text-purple-300 border border-purple-500/40 rounded-lg px-3 py-1.5">Alocar 100%</button>
        </div>
        <div><label class="lbl">Valor (R$)</label><input id="trAmount" type="number" step="0.01" min="0.01" required class="in"></div>
        <div><label class="lbl">Meta / descrição</label><input id="trDesc" maxlength="160" value="Reserva de emergência" class="in"></div>
        <button class="btn">Confirmar transferência</button>
      </form>
    </section>

    <section id="t-audit" class="hidden card overflow-x-auto">
      <table class="w-full text-xs text-left">
        <thead class="text-slate-400 uppercase"><tr><th class="p-2">Data/hora</th><th class="p-2">Ação</th><th class="p-2">Entidade</th><th class="p-2">Detalhes</th></tr></thead>
        <tbody id="auditBody" class="divide-y divide-slate-800/60"></tbody>
      </table>
    </section>
  </div>

  <div id="toast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg text-sm shadow-lg"></div>
  <script src="/app.js"></script>
</body>
</html>
